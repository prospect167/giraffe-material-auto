# 注意：日志配置已迁移到 log4j2.xml
# logging:
#   level:
#     root: INFO
#     com.prospect.giraffe: DEBUG

# 水印去除配置
watermark-removal:
  # 全局开关（默认关闭）
  enabled: false
  
  # 默认使用的厂商: aliyun, tencent, baidu, disabled
  default-provider: disabled
  
  # 是否保存原图
  save-original: false
  
  # 超时时间（毫秒）
  timeout: 30000
  
  # 最大重试次数
  max-retry: 2
  
  # 阿里云配置
  aliyun:
    enabled: false
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    endpoint: imageprocess.cn-shanghai.aliyuncs.com
    free-quota: 1000  # 每月免费次数提示
    
  # 腾讯云配置  
  tencent:
    enabled: false
    secret-id: ${TENCENT_SECRET_ID:}
    secret-key: ${TENCENT_SECRET_KEY:}
    region: ap-shanghai
    bucket: ${TENCENT_BUCKET:}
    free-quota: 1000  # 每月免费次数提示
    
  # 百度智能云配置
  baidu:
    enabled: false
    api-key: ${BAIDU_API_KEY:}
    secret-key: ${BAIDU_SECRET_KEY:}
    free-quota: 500  # 每日免费次数提示

# AI图像处理配置（图片去重）
ai-image-processing:
  # 全局开关
  enabled: true
  # 默认服务商（主方案）：doubao（豆包 Seedream 4.5）
  default-provider: doubao
  # 降级服务商（备选方案）：aliyun（阿里云）- 如果豆包不可用时的备选
  fallback-provider: aliyun
  # 是否启用自动降级
  enable-auto-fallback: true
  # 超时时间（毫秒）- 图片生成可能较慢，建议60秒以上
  timeout: 60000
  # 最大重试次数
  max-retry: 2
  
  # 豆包配置（主方案）- 火山引擎方舟平台 / 豆包 Seedream 4.5 模型
  # 参考文档：https://www.volcengine.com/docs/82379/1824121?lang=zh
  # 认证方式：Bearer Token（只需要 API Key）
  # API Key 获取地址：https://console.volcengine.com/ark/region:ark+cn-beijing/apikey
  doubao:
    enabled: true
    # API密钥（从火山引擎方舟控制台获取）
    # 配置方式：
    # 1. 环境变量：export ARK_API_KEY=你的密钥
    # 2. 本地配置文件：创建 application-local.yml（不会被提交到git）
    api-key: ${ARK_API_KEY:}
    # API基础地址（火山引擎方舟平台）
    # 图片生成接口会自动拼接 /images/generations
    base-url: ${ARK_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}
    # 模型ID：豆包 Seedream 4.5
    # 可以使用模型名称或模型端点ID（ep-xxx）
    model: ${ARK_MODEL:doubao-seedream-4-5-251128}
    # 生成图片尺寸
    size: ${ARK_IMAGE_SIZE:2K}
    # 图生图强度（0.0-1.0），值越小越接近原图，值越大水印去更干净，推荐0.45-0.55
    strength: ${ARK_STRENGTH:0.50}
    # 区域
    region: ${ARK_REGION:cn-beijing}
    # 提示词管理：集中在常量类 com.prospect.giraffe.material.constants.PromptConstants
    # 修改提示词请编辑该常量类，历史版本均有保留
  
  # 阿里云通义千问配置（备选方案）
  aliyun:
    enabled: true
    # 阿里云AccessKey ID（从环境变量读取）
    access-key-id: ${ALIYUN_ACCESS_KEY_ID:}
    # 阿里云AccessKey Secret（从环境变量读取）
    access-key-secret: ${ALIYUN_ACCESS_KEY_SECRET:}
    # 端点地址
    endpoint: dashscope.aliyuncs.com
    # 使用的模型
    model: qwen-vl-plus

